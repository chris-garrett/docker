name: "Build Image"

inputs:
  service_name:
    description: "Service name. Example: python"
    required: true
  github_token:
    description: "GitHub token for creating/merging PR"
    required: true
  ci_github_token:
    description: "PAT with workflow permission for main release tags; omitted for PRs"
    required: false

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ github.ref == 'refs/heads/main' && inputs.ci_github_token || inputs.github_token }}

    - name: Log in to the Container registry
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Setup env
      shell: bash
      run: cat config.env | grep -v '^#' >> $GITHUB_ENV

    - name: Build Image
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      shell: bash
      run: ./task ${{ inputs.service_name }}:build

    - name: Tag image release
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ inputs.ci_github_token }}
      shell: bash
      run: ./task ${{ inputs.service_name }}:tag

    - name: Publish released image version in README
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      shell: bash
      run: ./task ${{ inputs.service_name }}:publish-readme
